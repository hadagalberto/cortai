services:
  cortes:
    build: .
    image: cortai:latest
    command: python cortai.py run
    env_file: .env
    environment:
      TZ: America/Sao_Paulo
    volumes:
      - ./work:/app/work
      - ./out:/app/out
      - ./config.json:/app/config.json
      - ./branding:/app/branding
    restart: unless-stopped
    init: true
    stop_grace_period: 40s

  painel:
    build: .
    image: cortai:latest
    command: python cortai.py serve --host 0.0.0.0 --port 8787 --no-browser
    env_file: .env
    environment:
      TZ: America/Sao_Paulo
      PANEL_PASSWORD: ${PANEL_PASSWORD:-}
    ports:
      - "8787:8787"
    volumes:
      - ./work:/app/work
      - ./out:/app/out
      - ./config.json:/app/config.json
      - ./branding:/app/branding
    depends_on:
      - cortes
    restart: unless-stopped

